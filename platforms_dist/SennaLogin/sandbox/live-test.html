<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sandbox Gemini Live - Teste Oral</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #04142b; color: white; margin: 0; }
    h1 { color: #fdc300; }
    .btn { background: #fdc300; color: #04142b; padding: 20px 40px; font-size: 24px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; transition: transform 0.2s; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    .btn:hover { transform: scale(1.05); }
    .btn.active { background: #ff4757; color: white; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 71, 87, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); } }
    #log { margin-top: 30px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; max-width: 600px; width: 100%; height: 200px; overflow-y: auto; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Gemini Live API - Simulador de Bate-Papo</h1>
  <p>Converse livremente com o Mentor IAS.</p>
  
  <button id="start-btn" class="btn">🎤 Iniciar Conversa</button>
  
  <div id="log">Logs de conexão aparecerão aqui...</div>

  <script>
    const btn = document.getElementById('start-btn');
    const logEl = document.getElementById('log');
    let isConnected = false;

    function log(msg) {
      logEl.innerHTML += '<div>> ' + msg + '</div>';
      logEl.scrollTop = logEl.scrollHeight;
    }

    btn.addEventListener('click', async () => {
      if (isConnected) {
        log('Desconectando não implementado neste protótipo básico.');
        return;
      }
      
      try {
        log('Solicitando acesso ao microfone...');
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        log('Microfone ativado! Em um cenário real, o WebSocket conectaria com a Gemini Live API aqui.');
        
        btn.classList.add('active');
        btn.innerText = '🎙️ Ouvindo... (Simulação)';
        isConnected = true;

        // O código real do Gemini Live exigiria um socket bidirecional
        // com codificação PCM16 e envio via ws://...
        // Como isso é um sandbox de interface para a prova de conceito:
        setTimeout(() => {
           log('Simulação de resposta recebida do Gemini...');
           const audio = new Audio(); // Toca um bip ou voz de teste
        }, 5000);
        
      } catch (err) {
        log('Erro: ' + err.message);
      }
    });
  </script>
</body>
</html>
